name: refresh-catalog

# Rebuild index.json, statistics.json and the library map from committed records.
on:
  workflow_dispatch:
  schedule:
    - cron: "41 4 * * 1"

permissions:
  contents: read

concurrency:
  group: refresh-catalog
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-afid
      - name: Rebuild
        run: |
          afid database validate
          afid database index
          afid dependencies build
          afid database stats >> "$GITHUB_STEP_SUMMARY"
          afid report --format markdown --output catalog-report.md
      - id: diff
        run: |
          git add -A database
          git diff --cached --binary > database-changes.patch
          if [ -s database-changes.patch ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; else echo "changed=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: catalog
          path: |
            catalog-report.md
            database-changes.patch
          retention-days: 14
          if-no-files-found: ignore

  propose:
    needs: refresh
    if: needs.refresh.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-afid
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: catalog
          path: ${{ runner.temp }}/artifact
      - name: Open pull request
        env:
          GH_TOKEN: ${{ github.token }}
          AFID_COMMIT_TRAILER: ${{ vars.AFID_COMMIT_TRAILER }}
        run: |
          git apply --index "$RUNNER_TEMP/artifact/database-changes.patch"
          python scripts/open_data_pr.py --branch-prefix afid/catalog --title "AFID: refresh generated catalog files" --body-file "$RUNNER_TEMP/artifact/catalog-report.md"
