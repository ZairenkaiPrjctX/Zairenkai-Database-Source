name: check-updates

# Daily update check. Compares provider sources with stored snapshots using revision markers
# (content hashes, git blob SHAs), never timestamps. Opens a PR only when metadata changed.
# Dump providers (thousands of repositories) are skipped here; see discover-dumps.yml.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      provider:
        description: Provider id (empty = all)
        required: false
  push:
    branches: [dev]
    paths:
      - config/provider_registry.yml

permissions:
  contents: read

concurrency:
  group: check-updates
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-afid
      - name: Check sources (metadata only)
        env:
          PROVIDER: ${{ inputs.provider }}
        run: |
          args=(--write --skip-dumps --report-out reports/update-report.json)
          if [ -n "$PROVIDER" ]; then args+=(--provider "$PROVIDER"); fi
          mkdir -p reports
          set +e
          afid updates check "${args[@]}"
          status=$?
          set -e
          afid database index
          afid database validate --check-index
          afid policy check
          afid --json updates report > reports/history-report.json
          exit $status
      - id: diff
        name: Package metadata changes
        run: |
          git add -A database
          git diff --cached --binary > database-changes.patch
          if [ -s database-changes.patch ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; else echo "changed=false" >> "$GITHUB_OUTPUT"; fi
          {
            echo "## AFID update check"
            if [ -f reports/update-report.json ]; then python -c "import json;r=json.load(open('reports/update-report.json'));print('Summary:', r['summary'])"; else echo "No changes."; fi
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: update-check
          path: |
            reports/*.json
            database-changes.patch
          retention-days: 30
          if-no-files-found: ignore

  propose:
    needs: check
    if: needs.check.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-afid
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: update-check
          path: ${{ runner.temp }}/artifact
      - name: Open pull request
        env:
          GH_TOKEN: ${{ github.token }}
          AFID_COMMIT_TRAILER: ${{ vars.AFID_COMMIT_TRAILER }}
        run: |
          git apply --index "$RUNNER_TEMP/artifact/database-changes.patch"
          python - <<'PY' > "$RUNNER_TEMP/pr-body.md"
          import json, os, pathlib
          p = pathlib.Path(os.environ["RUNNER_TEMP"], "artifact", "reports", "update-report.json")
          r = json.loads(p.read_text()) if p.exists() else {"summary": {}, "changes": []}
          print("Automated AFID update check.\n")
          print("Summary:", r["summary"], "\n")
          for c in r["changes"][:200]:
              print(f"- {c['change']} {c['record_type']} `{c['record_id']}` {c.get('detail') or ''}")
          print("\nIdentity items marked 'unverified' need human review before linking devices.")
          PY
          python scripts/open_data_pr.py --branch afid/updates --title "AFID: metadata updates" --body-file "$RUNNER_TEMP/pr-body.md"
