# Provider registry. One entry per independent source.
#
# status:
#   active                  works end to end for its declared capabilities
#   metadata_only           discovers metadata; no firmware download
#   manual_import_required  user downloads firmware; AFID imports and verifies it locally
#   unsupported             known source that cannot be used (reason in `limitations`)
#
# `capabilities` must equal the implementation (checked by `afid providers test`).
# Tokens, if a source ever needs one, are read from the environment variable named in
# auth.token_env; never put a token in this file.
schema_version: '1.0'
providers:
- id: google_pixel
  class: afid.providers.local.GooglePixelProvider
  brand_ids:
  - google_pixel
  status: manual_import_required
  source_type: user_supplied_local_firmware
  source_urls:
  - https://developers.google.com/android/images
  - https://developers.google.com/android/ota
  allowed_hosts: []
  capabilities:
    discover_devices: false
    discover_firmware: false
    fetch_metadata: false
    download: false
    verify: true
    local_import: true
  auth:
    method: none
  distribution_default: user_supplied
  last_verified: '2026-10-18'
  limitations: 'Official factory images and full OTAs exist, but the image tables are shown only after
    accepting Google''s terms in a browser (verified 2026-10-18: the served HTML contains no image tables
    and states the files ''are for personal use ... and have usage restrictions based on licensing terms'').
    AFID does not bypass that step: download the package yourself, then run `afid ingest --local <file>
    --provider google_pixel [--sha256 <value from the page>]`.'
  settings: {}
- id: samsung
  class: afid.providers.local.SamsungProvider
  brand_ids:
  - samsung
  status: manual_import_required
  source_type: user_supplied_local_firmware
  source_urls: []
  allowed_hosts: []
  capabilities:
    discover_devices: false
    discover_firmware: false
    fetch_metadata: false
    download: false
    verify: true
    local_import: true
  auth:
    method: none
  distribution_default: user_supplied
  last_verified: '2026-10-18'
  limitations: No official, documented, public firmware download API was verified. Import packages you
    obtained yourself (TAR/.tar.md5; LZ4-compressed images need the `lz4` tool). Samsung's open-source
    portal (opensource.samsung.com) is kernel/platform source, not firmware, and returned HTTP 403 to
    automated requests during verification.
  settings: {}
