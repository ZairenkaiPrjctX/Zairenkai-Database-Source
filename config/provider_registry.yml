- id: lineageos_wiki
  class: afid.providers.lineageos_wiki.LineageWikiProvider
  brand_ids:
  - samsung
  - xiaomi
  - poco
  - redmi
  - oneplus
  - google_pixel
  - nothing
  status: metadata_only
  source_type: community_repository
  source_urls:
  - https://github.com/LineageOS/lineage_wiki
  - https://raw.githubusercontent.com/LineageOS/lineage_wiki/main/_data/devices/
  allowed_hosts:
  - github.com
  - raw.githubusercontent.com
  capabilities:
    discover_devices: true
    discover_firmware: false
    fetch_metadata: false
    download: false
    verify: false
    local_import: false
  auth:
    method: none
  distribution_default: metadata_only
  last_verified: '2026-10-18'
  limitations: Community device metadata only (no firmware). Its content license is not stated in the
    repository's licenses/ directory (that MIT license covers the site theme), so only factual metadata
    with attribution is recorded. Candidates are never 'verified' from this source alone. Covers only
    devices with LineageOS ports; Infinix and TECNO were not found in the data.
  settings:
    brand_rules:
    - brand_id: google_pixel
      vendors:
      - Google
      name_prefixes:
      - Pixel
    - brand_id: poco
      vendors:
      - Xiaomi
      - POCO
      - Poco
      name_prefixes:
      - POCO
      - Poco
    - brand_id: redmi
      vendors:
      - Xiaomi
      - Redmi
      name_prefixes:
      - Redmi
    - brand_id: xiaomi
      vendors:
      - Xiaomi
    - brand_id: samsung
      vendors:
      - Samsung
    - brand_id: oneplus
      vendors:
      - OnePlus
    - brand_id: nothing
      vendors:
      - Nothing
