- id: lineageos_wiki
  class: afid.providers.lineageos_wiki.LineageWikiProvider
  brand_ids:
  - samsung
  - xiaomi
  - poco
  - redmi
  - oneplus
  - google_pixel
  - nothing
  status: metadata_only
  source_type: community_repository
  source_urls:
  - https://github.com/LineageOS/lineage_wiki
  - https://raw.githubusercontent.com/LineageOS/lineage_wiki/main/_data/devices/
  allowed_hosts:
  - github.com
  - raw.githubusercontent.com
  capabilities:
    discover_devices: true
    discover_firmware: false
    fetch_metadata: false
    download: false
    verify: false
    local_import: false
  auth:
    method: none
  distribution_default: metadata_only
  last_verified: '2026-10-18'
  limitations: Community device metadata only (no firmware). Content is CC BY-SA 3.0 as declared by the
    wiki's own footer template (no file-level license for the data); records keep attribution and share-alike
    terms. Candidates are never 'verified' from this source alone. Covers only devices with LineageOS
    ports; Infinix and TECNO were not found in the data.
  settings:
    brand_rules:
    - brand_id: google_pixel
      vendors:
      - Google
      name_prefixes:
      - Pixel
    - brand_id: poco
      vendors:
      - Xiaomi
      - POCO
      - Poco
      name_prefixes:
      - POCO
      - Poco
    - brand_id: redmi
      vendors:
      - Xiaomi
      - Redmi
      name_prefixes:
      - Redmi
    - brand_id: xiaomi
      vendors:
      - Xiaomi
    - brand_id: samsung
      vendors:
      - Samsung
    - brand_id: oneplus
      vendors:
      - OnePlus
    - brand_id: nothing
      vendors:
      - Nothing
  data_license:
    spdx: CC-BY-SA-3.0
    status: declared_by_source
    basis: The repository has no license file for _data/devices/ (licenses/ covers only the site theme,
      MIT, and Navgoco, BSD). Its footer template _includes/layout/footer.html renders 'Licensed under
      CC BY-SA 3.0' on every page generated from this data, including device pages; confirmed on https://wiki.lineageos.org/devices/oriole/
      (2026-10-18).
    evidence_urls:
    - https://github.com/LineageOS/lineage_wiki/blob/2c365be2b66336e4da1f3ca3bdd71c17eb819005/_includes/layout/footer.html
    - https://wiki.lineageos.org/devices/oriole/
    - https://creativecommons.org/licenses/by-sa/3.0/
    attribution: 'Device metadata from the LineageOS Wiki (https://wiki.lineageos.org), (c) The LineageOS
      Project, licensed under CC BY-SA 3.0 (https://creativecommons.org/licenses/by-sa/3.0/). Adapted
      by AFID: selected factual fields only.'
    share_alike: true
