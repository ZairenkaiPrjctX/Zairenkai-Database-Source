  - zte
  - honor
  - huawei
  - itel
  - tcl
  - htc
  - fairphone
  - umidigi
  - blackshark
  status: metadata_only
  source_type: community_firmware_dump
  source_urls:
  - https://gitlab.com/Android-Dumps
  - https://gitlab.com/api/v4/groups/13303221/projects
  allowed_hosts:
  - gitlab.com
  capabilities:
    discover_devices: false
    discover_firmware: true
    fetch_metadata: true
    download: false
    verify: false
    local_import: false
  auth:
    method: none
  distribution_default: unknown
  last_verified: '2026-10-18'
  limitations: Public GitLab group of DumprX dumps (430 projects on 2026-10-18; one project per device,
    one branch per firmware build). AFID lists projects/branches and fetches a bounded set of individual
    files pinned to the branch commit; it never clones, never downloads archives and never pushes. Namespace
    and project names are hints; identity comes from the dump's build.prop. Some large files are Git LFS
    pointers and are recorded as such, not fetched. Unauthenticated API limit 500 requests per window.
  settings:
    api_base: https://gitlab.com/api/v4
    group: 13303221
    group_path: Android-Dumps
    max_project_pages: 20
    min_projects: 200
    max_branches_per_project: 50
    max_tree_pages: 400
  data_license:
    spdx: null
    status: unknown
    basis: Dumps of OEM firmware published by third parties without a license; the files are proprietary
      vendor/OEM content. AFID stores metadata (paths, hashes, parsed structure) only and keeps distribution
      status 'unknown'.
    evidence_urls: []
    attribution: null
    share_alike: false
