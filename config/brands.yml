# Canonical brand registry. brand_id values are stable and used in directory names.
#
# scope:
#   core      the nine brands AFID was built for; every provider and report covers them
#   extended  brands seen in community firmware dumps (Android-Dumps, tadiphone). A device of
#             an extended brand is cataloged only from firmware evidence, exactly like a core
#             brand; a build.prop brand that is in neither list stays in staging.
# Aliases are matched case-insensitively against ro.product.{vendor.}brand / manufacturer.
schema_version: "1.0"
brands:
  - brand_id: samsung
    display_name: Samsung
    aliases: [Samsung, SAMSUNG, samsung]
    ecosystem: samsung
    scope: core
  - brand_id: xiaomi
    display_name: Xiaomi
    aliases: [Xiaomi, XIAOMI, Mi, xiaomi]
    ecosystem: xiaomi
    scope: core
  - brand_id: poco
    display_name: POCO
    aliases: [POCO, Poco, poco]
    ecosystem: xiaomi
    scope: core
    product_name_prefixes: [POCO, Poco]
  - brand_id: redmi
    display_name: Redmi
    aliases: [Redmi, REDMI, redmi]
    ecosystem: xiaomi
    scope: core
    product_name_prefixes: [Redmi]
  - brand_id: infinix
